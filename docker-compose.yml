# pgstack-prod — Production PostgreSQL 16 stack with PgBouncer, pgAdmin, Netdata, and automated backups.
# Deploy with: ./deploy.sh up

networks:
  traefik_proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_proxy}
  db_internal:
    internal: true
  monitor_internal:
    internal: true

volumes:
  pgdata:
    driver: local
  pgbackups:
    driver: local
  netdata_lib:
    driver: local
  netdata_cache:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    networks:
      - db_internal
      - monitor_internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/conf.d/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgbouncer:
    image: neondatabase/pgbouncer:1.24.1-2305be8887b9-21147949919
    container_name: pgbouncer
    restart: always
    networks:
      - db_internal
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      PGBOUNCER_DATABASE: ${POSTGRES_DB}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_MIN_POOL_SIZE: 5
      PGBOUNCER_RESERVE_POOL_SIZE: 5
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    networks:
      - db_internal
      - traefik_proxy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: '"Restricted access. Authorized personnel only."'
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 40
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "True"
      PGADMIN_CONFIG_WTF_CSRF_SSL_STRICT: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/misc/ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}
      - traefik.http.routers.pgstack-pgadmin.rule=Host(`${PGADMIN_DOMAIN}`)
      - traefik.http.routers.pgstack-pgadmin.entrypoints=${TRAEFIK_ENTRYPOINT_SECURE:-websecure}
      - traefik.http.routers.pgstack-pgadmin.tls=true
      - traefik.http.routers.pgstack-pgadmin.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.pgstack-pgadmin.service=pgstack-pgadmin
      - traefik.http.services.pgstack-pgadmin.loadbalancer.server.port=80
      - traefik.http.routers.pgstack-pgadmin.middlewares=pgstack-pgadmin-ipwhitelist
      - traefik.http.middlewares.pgstack-pgadmin-ipwhitelist.ipallowlist.sourcerange=${PGADMIN_ALLOWED_IPS}
      - traefik.http.routers.pgstack-pgadmin-http.rule=Host(`${PGADMIN_DOMAIN}`)
      - traefik.http.routers.pgstack-pgadmin-http.entrypoints=${TRAEFIK_ENTRYPOINT_INSECURE:-web}
      - traefik.http.routers.pgstack-pgadmin-http.middlewares=pgstack-pgadmin-redirect
      - traefik.http.middlewares.pgstack-pgadmin-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.pgstack-pgadmin-redirect.redirectscheme.permanent=true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: postgres-backup
    restart: always
    networks:
      - db_internal
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: always
    hostname: ${NETDATA_HOSTNAME}
    networks:
      - monitor_internal
      - traefik_proxy
    environment:
      NETDATA_CLAIM_TOKEN: ""
      NETDATA_CLAIM_URL: https://app.netdata.cloud
      NETDATA_CLAIM_ROOMS: ""
      DO_NOT_TRACK: 1
    volumes:
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - ./netdata/netdata.conf:/etc/netdata/netdata.conf:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    pid: host
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:19999/api/v1/info >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}
      - traefik.http.routers.pgstack-netdata.rule=Host(`${NETDATA_DOMAIN}`)
      - traefik.http.routers.pgstack-netdata.entrypoints=${TRAEFIK_ENTRYPOINT_SECURE:-websecure}
      - traefik.http.routers.pgstack-netdata.tls=true
      - traefik.http.routers.pgstack-netdata.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.pgstack-netdata.service=pgstack-netdata
      - traefik.http.services.pgstack-netdata.loadbalancer.server.port=19999
      - traefik.http.routers.pgstack-netdata.middlewares=pgstack-netdata-auth,pgstack-netdata-ipwhitelist
      - traefik.http.middlewares.pgstack-netdata-auth.basicauth.users=${NETDATA_BASIC_AUTH}
      - traefik.http.middlewares.pgstack-netdata-ipwhitelist.ipallowlist.sourcerange=${NETDATA_ALLOWED_IPS}
      - traefik.http.routers.pgstack-netdata-http.rule=Host(`${NETDATA_DOMAIN}`)
      - traefik.http.routers.pgstack-netdata-http.entrypoints=${TRAEFIK_ENTRYPOINT_INSECURE:-web}
      - traefik.http.routers.pgstack-netdata-http.middlewares=pgstack-netdata-redirect
      - traefik.http.middlewares.pgstack-netdata-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.pgstack-netdata-redirect.redirectscheme.permanent=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
