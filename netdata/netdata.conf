# =============================================================================
# pgstack-prod — Netdata configuration
# =============================================================================
# Netdata auto-discovers Docker containers via the mounted Docker socket and
# collects per-container metrics (CPU, memory, network, disk I/O).
#
# PostgreSQL deep metrics (connections, queries/sec, locks, WAL, autovacuum,
# checkpoints, pg_stat_statements) require an optional monitoring role in
# PostgreSQL. Run the following SQL as a superuser (optional):
#
#   CREATE ROLE netdata WITH LOGIN PASSWORD 'netdata_password_here';
#   GRANT pg_monitor TO netdata;
#
# Without this role, Netdata still collects container-level metrics for the
# postgres container via Docker/cgroups.
# =============================================================================

[global]
    # Overridden by NETDATA_HOSTNAME env var at runtime
    hostname = prod-server-01
    # 1 hour of per-second metrics in RAM; increase if you have more RAM
    history = 3600
    # Collection interval in seconds
    update every = 1
    # Persistent storage mode — survives restarts via named volume
    memory mode = dbengine
    # MB of RAM for dbengine page cache
    page cache size = 32
    # MB of disk space for metrics history in the named volume
    dbengine disk space = 256

[web]
    # Traefik handles access restriction — do not expose port directly
    bind to = *
    # Docker networks only
    allow connections from = localhost 172.16.0.0/12 10.0.0.0/8
    enable gzip compression = yes

[plugins]
    proc = yes
    diskspace = yes
    # Docker container metrics
    cgroups = yes
    python.d = yes
    go.d = yes

[logs]
    error log = stderr
    # Reduces noise; enable if debugging Traefik connectivity
    access log = none
