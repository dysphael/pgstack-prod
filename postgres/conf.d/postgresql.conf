# =============================================================================
# pgstack-prod — PostgreSQL 16 production configuration
# =============================================================================
# Tuned for a VPS with 2–4 GB RAM and SSD storage.
#
# RAM scaling formula:
#   shared_buffers       = ~25% of total RAM
#   effective_cache_size = ~75% of total RAM (planner hint only, not allocated)
#
# Example for 8 GB RAM: shared_buffers = 2GB, effective_cache_size = 6GB
# =============================================================================

# -----------------------------------------------------------------------------
# Connections
# -----------------------------------------------------------------------------
# PgBouncer handles client connection pooling; keep direct connections modest.
max_connections = 100
superuser_reserved_connections = 3

# -----------------------------------------------------------------------------
# Memory (calibrated for 2–4 GB RAM)
# -----------------------------------------------------------------------------
shared_buffers = 512MB                  # ~25% of total RAM
effective_cache_size = 1536MB           # ~75% of total RAM — planner hint only
work_mem = 16MB                         # per sort/hash operation per connection
maintenance_work_mem = 128MB

# -----------------------------------------------------------------------------
# WAL / Checkpoint
# -----------------------------------------------------------------------------
wal_buffers = 16MB
checkpoint_completion_target = 0.9
wal_level = replica                     # enables future replication without reconfiguration

# -----------------------------------------------------------------------------
# Planner (SSD-optimized)
# -----------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# -----------------------------------------------------------------------------
# Autovacuum (aggressive production settings)
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
autovacuum_max_workers = 3

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log_destination = 'stderr'            # Docker captures stderr natively
logging_collector = off
log_min_duration_statement = 500        # log queries slower than 500ms
log_checkpoints = on
log_connections = off                   # too verbose with PgBouncer
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%t [%p] %u@%d '

# -----------------------------------------------------------------------------
# Locale / Timezone
# -----------------------------------------------------------------------------
timezone = 'America/Sao_Paulo'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
ssl = off                               # TLS terminates at Traefik/load balancer
password_encryption = scram-sha-256

# -----------------------------------------------------------------------------
# Extensions
# -----------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
