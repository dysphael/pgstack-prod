# Production tuning (defaults for a 2 GB RAM VPS with SSD).
# Scale shared_buffers / effective_cache_size if your server has more RAM.
#
# RAM guide:
#   2 GB → shared_buffers=512MB,  effective_cache_size=1536MB
#   4 GB → shared_buffers=1GB,     effective_cache_size=3GB
#   8 GB → shared_buffers=2GB,     effective_cache_size=6GB

listen_addresses = '*'
port = 5432
timezone = 'UTC'
log_timezone = 'UTC'

max_connections = 100
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 128MB

random_page_cost = 1.1
effective_io_concurrency = 200
checkpoint_completion_target = 0.9

log_min_duration_statement = 500
log_connections = on
log_disconnections = on
log_statement = 'ddl'
password_encryption = scram-sha-256

# Persistent log files (mounted at /var/log/postgresql)
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on
log_line_prefix = '%t [%p] %u@%d '

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
